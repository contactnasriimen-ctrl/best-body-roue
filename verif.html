<!doctype html>
<html lang="ar-TN" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>تثبّت من الكود · Best Body</title>
<style>
@font-face { font-family: Cairo; font-weight: 800; src: url(assets/fonts/Cairo_800ExtraBold.ttf); }
@font-face { font-family: Montserrat; font-weight: 900; src: url(assets/fonts/Montserrat_900Black.ttf); }
:root { --gold: #E9BE48; --gold1: #FFF1B8; --card: #151413; --line: rgba(233, 190, 72, .25); }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; background: #0A0A0B; color: #F6F2E8; font: 800 17px/1.6 Cairo, system-ui, sans-serif; }
.wrap { max-width: 460px; margin: 0 auto; padding: 24px 16px; }
h1 { font-size: 26px; margin: 0 0 4px; color: var(--gold1); }
p { color: #B5AD9C; margin: 0 0 18px; font-size: 15px; }
input { width: 100%; padding: 14px; border-radius: 14px; border: 2px solid var(--line); background: var(--card); color: #fff; font: 900 24px Montserrat, sans-serif; letter-spacing: .08em; text-align: center; direction: ltr; text-transform: uppercase; }
input:focus { outline: none; border-color: var(--gold); }
button { margin-top: 10px; width: 100%; padding: 12px; border: 0; border-radius: 14px; background: linear-gradient(180deg, #FFF1B8, #F2C94C 45%, #C08A1E); color: #17120a; font: 900 18px Cairo, sans-serif; cursor: pointer; }
.res { margin-top: 16px; padding: 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); display: none; }
.res.ok { display: block; border-color: #1FA855; }
.res.bad { display: block; border-color: #E5484D; }
.res b { font-size: 20px; }
.small { font-size: 14px; color: #B5AD9C; margin-top: 6px; }
.mark { margin-top: 10px; background: #2a2723; color: #fff; }
</style>
</head>
<body>
<div class="wrap">
  <h1>تثبّت من كود الربح</h1>
  <p>للفريق متاع <bdi>Best Body</bdi> برك. اكتب الكود اللي بعثهولك الحريف.</p>
  <input id="code" placeholder="BB-CR-XXXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" aria-label="الكود">
  <button id="go" type="button">ثبّت</button>
  <div class="res" id="res" role="status"></div>
</div>
<script src="config.js"></script>
<script>
(function () {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789', CFG = window.ROUE_CONFIG, KEY = 'bb-roue-used';
  const used = () => { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } };
  const $ = (id) => document.getElementById(id), res = $('res');
  function check() {
    const c = $('code').value.trim().toUpperCase().replace(/\s+/g, '');
    const m = c.match(/^BB-(LM|CR)-([A-Z2-9]{4})([A-Z2-9])$/);
    let ok = false;
    if (m) { let sum = 0; for (const ch of m[1] + m[2]) sum = (sum * 31 + ch.charCodeAt(0)) % A.length; ok = A[sum] === m[3]; }
    if (!ok) { res.className = 'res bad'; res.innerHTML = '<b>❌ الكود غالط</b><div class="small">ما يخرجش من الروّة متاعنا (ولا فيه غلطة في الكتيبة).</div>'; return; }
    const u = used()[c];
    res.className = 'res ok';
    res.innerHTML = `<b>✅ كود صحيح: ${CFG.lots[m[1]].nom.replace(/([A-Za-z][A-Za-z ]*[A-Za-z])/g, '<bdi>$1</bdi>')}</b>` +
      (u ? `<div class="small" style="color:#E5484D">⚠ الكود هذا تسجّل قبل على هالتليفون نهار ${u}.</div>` : '<div class="small">ثبّت زادة اللي الحساب يتابع الصفحة و ما ربحش قبل.</div>') +
      (u ? '' : '<button class="mark" id="mark" type="button">سجّل الكود (تعطى الكادو)</button>');
    const mk = $('mark');
    if (mk) mk.onclick = () => { const all = used(); all[c] = new Date().toLocaleDateString('fr-TN'); try { localStorage.setItem(KEY, JSON.stringify(all)); } catch {} check(); };
  }
  $('go').onclick = check;
  $('code').addEventListener('keydown', (e) => { if (e.key === 'Enter') check(); });
})();
</script>
</body>
</html>
